name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
      webclient: ${{ steps.filter.outputs.webclient }}
      data: ${{ steps.filter.outputs.data }}
      map: ${{ steps.filter.outputs.map }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            server: &server
              - 'server/**'
              - 'motis-openapi-progenitor/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yaml'
              - '.github/workflows/server-cicd.yml'
              - '.github/workflows/_docker-build.yml'
            webclient: &webclient
              - 'webclient/**'
              # webclient/biome.jsonc extends the root config, so lint results depend on it.
              - 'biome.jsonc'
              - '.github/workflows/ci.yaml'
              - '.github/workflows/webclient-cicd.yml'
              - '.github/workflows/_docker-build.yml'
            data: &data
              - 'data/**'
              - 'pyproject.toml'
              - 'uv.lock'
              # uv sync --frozen selects the interpreter from .python-version.
              - '.python-version'
              - '.github/workflows/ci.yaml'
              - '.github/workflows/data-cicd.yml'
            map: &map
              - 'map/**'
              # render-e2e exercises the indoor tile functions defined in these migrations, so a
              # migration change must trigger the map jobs.
              - 'server/migrations/**'
              - '.github/workflows/ci.yaml'
              - '.github/workflows/martin-cicd.yml'
              - '.github/workflows/_docker-build.yml'
            e2e:
              - *server
              - *webclient
              - *data
              - *map
              - 'tests/**'
              - 'compose.yml'
              - 'compose.local.yml'
              - '.github/workflows/e2e-tests.yml'

  server:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.server == 'true' }}
    uses: ./.github/workflows/server-cicd.yml
    permissions:
      contents: read

  webclient:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.webclient == 'true' }}
    uses: ./.github/workflows/webclient-cicd.yml
    permissions:
      contents: read

  # The images are built at the top level so that the e2e tests can start as soon as they are ready,
  # instead of waiting for the lints and unit tests, and so that they are built only once.
  server-image:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true' }}
    uses: ./.github/workflows/_docker-build.yml
    with:
      image_suffix: server
      context: ./
      dockerfile: server/Dockerfile
      e2e_artifact: server
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write

  webclient-image:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true' }}
    uses: ./.github/workflows/_docker-build.yml
    with:
      image_suffix: webclient
      context: ./webclient
      dockerfile: Dockerfile
      e2e_artifact: webclient
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write

  data:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.data == 'true' }}
    uses: ./.github/workflows/data-cicd.yml
    permissions:
      contents: read

  map:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.map == 'true' }}
    uses: ./.github/workflows/martin-cicd.yml
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write

  e2e:
    needs: [ changes, server-image, webclient-image ]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true' }}
    uses: ./.github/workflows/e2e-tests.yml
    permissions:
      contents: read

  # Don't change its name - it is used by the merge protection rules.
  ci-passed:
    name: Finished CI
    runs-on: ubuntu-latest
    needs: [ changes, server, webclient, server-image, webclient-image, data, map, e2e ]
    if: always()
    permissions: {}
    steps:
      - name: Result of the needed jobs
        run: echo "${{ toJSON(needs) }}" # zizmor: ignore[template-injection]
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        name: CI Result
        run: exit 1
