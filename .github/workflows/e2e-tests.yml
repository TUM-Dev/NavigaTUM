name: E2E Tests

on:
  workflow_call:
permissions: {}

env:
  COMPOSE_PROJECT_NAME: navigatum-e2e

jobs:
  api-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Download E2E images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
      - name: Load E2E images
        run: |
          docker load --input server.tar
          docker load --input webclient.tar
      - name: Setup | Pull Docker images
        # registry-1.docker.io occasionally times out mid-pull; retry to avoid a flake on transient
        # connection drops. `until` keeps `set -e` happy because failures in the condition aren't fatal.
        run: |
          attempt=1
          until docker compose -f compose.local.yml pull db meilisearch; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::docker compose pull failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::docker compose pull attempt $attempt failed, retrying in 15s"
            sleep 15
            attempt=$((attempt + 1))
          done
      - name: Setup | pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0
        with:
          version: 12.8.1
      - name: Setup | Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: tests/pnpm-lock.yaml

      - name: Setup | Playwright dependencies
        working-directory: tests
        run: pnpm install

      - name: Create .env file for docker-compose
        run: |
          cat > .env << EOF
          POSTGRES_PASSWORD=test_password
          POSTGRES_USER=postgres
          POSTGRES_DB=navigatum_test
          MEILI_MASTER_KEY=test_master_key
          LOG_LEVEL=debug
          EOF

      - name: Wait for server to become ready
        run: |
          set -euo pipefail

          echo "::group::Starting services…"
          docker compose -f compose.local.yml up -d --no-build --pull never

          echo "Current container status:"
          docker compose -f compose.local.yml ps

          echo "Waiting for API to become healthy (max 120s)…"

          timeout 120 bash -c 'until curl -f http://localhost:3003/api/search?q=MI; do sleep 2; done'
          if ! timeout 120 bash -c '
            until curl -fs http://localhost:3003/api/locations/mi >/dev/null; do
              echo "Still waiting for API…"
              sleep 2
            done
          '; then
            echo "::endgroup::"
            echo "::error::Timed out waiting for API to become healthy"

            echo "::group::Container status:"
            docker compose -f compose.local.yml ps
            echo "::endgroup::"

            echo "::group::Recent container logs:"
            docker compose -f compose.local.yml logs --tail=100
            echo "::endgroup::"

            exit 1
          fi

          echo "::group::API is responding"
          curl -v -f http://localhost:3003/api/status
          echo "::endgroup::"

          echo "Waiting for webclient to become healthy (max 120s)…"
          timeout 120 bash -c 'until curl -fs http://localhost:3000/metrics >/dev/null; do sleep 2; done'

      - name: Run API tests
        working-directory: tests
        run: pnpm test:api
        env:
          SKIP_WEBSERVER: true
          BASE_URL: http://localhost:3003
          WEBCLIENT_BASE_URL: http://localhost:3000

      - name: Server logs on failure
        if: failure()
        run: docker compose -f compose.local.yml logs server
      - name: Webclient logs on failure
        if: failure()
        run: docker compose -f compose.local.yml logs webclient
      - name: MeiliSearch logs on failure
        if: failure()
        run: docker compose -f compose.local.yml logs meilisearch
      - name: Database logs on failure
        if: failure()
        run: docker compose -f compose.local.yml logs db

  ui-tests-desktop:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
        subsystem: [main, search, navigation, details, calendar-about, map]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Download E2E images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
      - name: Load E2E images
        run: |
          docker load --input server.tar
          docker load --input webclient.tar
      - name: Setup | Pull Docker images
        run: |
          attempt=1
          until docker compose -f compose.local.yml pull db meilisearch; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::docker compose pull failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::docker compose pull attempt $attempt failed, retrying in 15s"
            sleep 15
            attempt=$((attempt + 1))
          done
      - name: Setup | Set up pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0
        with:
          version: 12.8.1
      - name: Setup | Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: tests/pnpm-lock.yaml

      - name: Setup | Install Playwright dependencies
        working-directory: tests
        run: pnpm install
      - name: Install Browser
        working-directory: tests
        # Playwright's downloader has no internal timeout, so a stalled CDN fetch hangs the job until
        # the 6h limit instead of failing. Cap each attempt and retry the transient stall.
        run: |
          attempt=1
          until timeout 300 pnpm exec playwright install ${{ matrix.browser }}; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::playwright install ${{ matrix.browser }} failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::playwright install ${{ matrix.browser }} attempt $attempt stalled, retrying"
            attempt=$((attempt + 1))
          done

      - name: Setup | Create .env file for docker-compose
        run: |
          cat > .env << EOF
          POSTGRES_PASSWORD=test_password
          POSTGRES_USER=postgres
          POSTGRES_DB=navigatum_test
          MEILI_MASTER_KEY=test_master_key
          LOG_LEVEL=debug
          EOF

      - name: Setup | Start Docker services
        run: |
          docker compose -f compose.local.yml up -d --no-build --pull never
          echo "Waiting for services to be healthy..."
          timeout 120 bash -c 'until curl -f http://localhost:3003/api/locations/mi; do sleep 2; done'
          timeout 120 bash -c 'until curl -f http://localhost:3003/api/search?q=MI; do sleep 2; done'
          timeout 120 bash -c 'until curl -f http://localhost:3000/; do sleep 2; done'

      - name: Run UI tests (${{ matrix.subsystem }})
        working-directory: tests
        run: pnpm test specs/${{ matrix.subsystem }}.ui.spec.ts --project=ui-tests-${{ matrix.browser }}
        env:
          BASE_URL: http://localhost:3000
          SKIP_WEBSERVER: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-playwright-report-${{ matrix.browser }}-${{ matrix.subsystem }}
          path: tests/playwright-report/
          retention-days: 30

      - name: Server logs on failure
        if: failure()
        run: docker compose -f compose.local.yml logs server
      - name: MeiliSearch logs on failure
        if: failure()
        run: docker compose -f compose.local.yml logs meilisearch
      - name: Database logs on failure
        if: failure()
        run: docker compose -f compose.local.yml logs db
