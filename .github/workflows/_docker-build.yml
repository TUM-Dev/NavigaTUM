name: Create and publish a Docker image
concurrency:
  group: docker-${{ inputs.image_suffix }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  workflow_call:
    inputs:
      image_suffix:
        required: true
        description: Suffix of generated dockerimages' name
        type: string
      context:
        required: true
        description: Context, docker build is executed in
        type: string
      dockerfile:
        required: true
        description: Dockerfile location (relative to context)
        type: string
      e2e_artifact:
        required: false
        default: ''
        description: >-
          If set, also export the image as a tarball artifact named image-<value>, tagged
          navigatum-e2e-<value>:latest, for the end-to-end tests to load instead of rebuilding.
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tum-dev/navigatum-${{ inputs.image_suffix }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Forked PRs do not have access to repo/org packages permissions and should not try to push.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to the Container registry
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Pre-pull buildkit image with retry
        # setup-buildx-action launches a docker-container builder that pulls
        # moby/buildkit:buildx-stable-1 from Docker Hub once, without retry.
        # When registry-1.docker.io rate-limits or times out, the whole build
        # fails before we ever invoke cargo. Pre-pulling with retry isolates
        # that transient failure mode from the actual build.
        run: |
          attempt=1
          until docker pull moby/buildkit:buildx-stable-1; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::docker pull moby/buildkit failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::buildkit pull attempt $attempt failed, retrying in 15s"
            sleep 15
            attempt=$((attempt + 1))
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Attestations only matter for images published from main.
          provenance: ${{ github.event_name == 'push' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name == 'push' }}
          context: ${{ inputs.context }} # zizmor: ignore[template-injection]
          push: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
          file: "${{ inputs.context }}/${{ inputs.dockerfile }}"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            GIT_COMMIT_MESSAGE="${github.event.head_commit.message//\n/}"
          # GHCR cache is shared across branches and free for public repos, unlike the 10GB Actions cache.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}/{1}:buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}
      - name: Export image for end-to-end tests
        if: ${{ inputs.e2e_artifact != '' }}
        # Reuses the layers the previous step just built, so this only serializes the image.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          provenance: false
          sbom: false
          context: ${{ inputs.context }} # zizmor: ignore[template-injection]
          file: "${{ inputs.context }}/${{ inputs.dockerfile }}"
          tags: navigatum-e2e-${{ inputs.e2e_artifact }}:latest
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            GIT_COMMIT_MESSAGE="${github.event.head_commit.message//\n/}"
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          outputs: type=docker,dest=${{ runner.temp }}/${{ inputs.e2e_artifact }}.tar
      - name: Upload image for end-to-end tests
        if: ${{ inputs.e2e_artifact != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ inputs.e2e_artifact }}
          path: ${{ runner.temp }}/${{ inputs.e2e_artifact }}.tar
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
      - name: Attest
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false # idk what is happening here with invalid image names, needs debugging
