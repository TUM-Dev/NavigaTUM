services:
  rebuild-valhalla:
    image: ghcr.io/onthegomap/planetiler:latest
    mem_limit: 50G
    memswap_limit: 50G
    cpu_shares: 512 # we don't want to gobble up all the CPU
    pull_policy: always
    environment:
      JAVA_TOOL_OPTIONS: -Xmx25g
    volumes:
      - /tmp/navigatum/map:/data
      - ./map/planetiler:/conf
    command:
      - ../conf/shortbread_custom.yml
      - --download
      - --download-threads=10
      - --download-chunk-size-mb=1000
      - --free_natural_earth_after_read=true
      - --free_water_polygons_after_read=true
      - --free_lake_centerlines_after_read=true
      - --compress_temp=true 
      - --fetch-wikidata
      - --languages=de,en
      - --Xmx25g
      - --nodemap-type=array
      - --storage=mmap
      - --area=planet
      - --bounds=world
      - --output=/data/output.mbtiles
      - --force=true
  valhalla-data:
    image: debian:trixie-slim
    command: [sh, /map/prepare-valhalla-data.sh, /data, /map/campuses.json]
    volumes:
      - ./tmp/navigatum/navigation/campuses/:/data:rw
      - ./map/prepare-valhalla-data.sh:/map/prepare-valhalla-data.sh:ro
      - ./map/valhalla-campus-extracts.json:/map/campuses.json:ro
  valhalla-build:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    mem_limit: 50G
    memswap_limit: 50G
    cpu_shares: 512 # we don't want to gobble up all the CPU
    pull_policy: always
    volumes:
      - ./tmp/navigatum/navigation/campuses/:/custom_files:rw
    environment:
      TZ: Europe/Berlin
      build_elevation: True
      force_rebuild: True
      build_admins: Force
      build_time_zones: Force
      build_transit: False
      use_default_speeds_config: True
      serve_tiles: False
    depends_on:
      valhalla-data:
        condition: service_completed_successfully
