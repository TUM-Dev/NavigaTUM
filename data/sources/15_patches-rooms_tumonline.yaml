  - {if_room_code: "4277\\.EG\\.006", alt_name: "1.2.EG.1, Treppe", arch_name: "1.2.EG.1@4277"}
  - {if_room_code: "4277\\.EG\\.007", alt_name: "1.2.EG11, Büro Mitarbeiter", arch_name: "1.2.EG11@4277"}
