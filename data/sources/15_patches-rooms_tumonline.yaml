  - {if_room_code: "4277\\.EG\\.013$", alt_name: "1.2.EG, Flur", arch_name: "1.2.EG@4277"}

# Handling of arch_name duplicates
duplicates:
  ignore: []
  prepend_level: []

# User-submitted rooms that aren't in TUMonline. Schema: `NewRoom` in `addition/room.rs`.
additions: []
